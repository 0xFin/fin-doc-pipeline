name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Read the CHANGELOG entry for this tag
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --latest
          else
            ok=no
            for attempt in 1 2 3; do
              if gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --latest; then ok=yes; break; fi
              sleep 3
            done
            if [ "$ok" != yes ]; then
              gh issue create --title "release failed for $GITHUB_REF_NAME" --body "gh release create failed after 3 attempts" || true
              exit 1
            fi
          fi

      - name: Check whether this version is already on npm
        id: npmcheck
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "fin-doc-pipeline@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: env.NPM_TOKEN != '' && steps.npmcheck.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm publish --provenance 2>&1 | tee npm-publish.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            gh issue create --title "npm publish failed for $GITHUB_REF_NAME" --body "$(tail -40 npm-publish.log)" || true
            exit $code
          fi

      - name: Explain a skipped publish
        if: env.NPM_TOKEN == '' || steps.npmcheck.outputs.exists == 'true'
        run: |
          echo '::notice::npm publish was skipped (no token, or this version already exists).'
