name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Read the CHANGELOG entry for this tag
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME"

      - name: Create or update the GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check whether this version is already on npm
        id: npmcheck
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "fin-doc-pipeline@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: env.NPM_TOKEN != '' && steps.npmcheck.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      - name: Explain a skipped publish
        if: env.NPM_TOKEN == '' || steps.npmcheck.outputs.exists == 'true'
        run: |
          echo '::notice::npm publish was skipped (no token, or this version already exists).'
