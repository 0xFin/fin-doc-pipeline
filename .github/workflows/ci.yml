name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the dependency free test suite
        run: node test/run.mjs

  ensure-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create the release when the current version tag has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag $tag has not been published yet"
            exit 0
          fi
          node scripts/release-notes.mjs "$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file RELEASE_NOTES.md
          else
            gh release create "$tag" --title "$tag" --notes-file RELEASE_NOTES.md
          fi

      - name: Sync the repository description, homepage and topics
        if: env.GH_PAT != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY" \
            -f description="中文文本处理流水线：编码识别 · 去重合并 · 校对排版 · 12 种格式互转。Dependency-free text pipeline: encoding, merge, proofread, 12 formats." \
            -f homepage="https://0xFin.github.io/fin-doc-pipeline/" \
            -F has_discussions=true > /dev/null
          gh api -X PUT "repos/$GITHUB_REPOSITORY/topics" \
            -f "names[]=chinese" -f "names[]=text-processing" -f "names[]=cli" \
            -f "names[]=proofreading" -f "names[]=typesetting" -f "names[]=epub" \
            -f "names[]=docx" -f "names[]=pdf" -f "names[]=agent-skill" -f "names[]=encoding" > /dev/null
          echo "repository metadata synced"

      - name: Note the missing admin token
        if: env.GH_PAT == ''
        run: echo '::notice::GH_PAT is not set; repository description, homepage and topics were not synced.'
