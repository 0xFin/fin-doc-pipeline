name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Read the CHANGELOG entry for this tag
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME"

      - name: Create the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false >/dev/null 2>&1 || true
          output=$(gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --latest 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ]; then
            gh issue create --title "release failed for $GITHUB_REF_NAME" --body "exit $code: $output" || true
            exit $code
          fi

      - name: Verify the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh issue create --title "release missing for $GITHUB_REF_NAME" --body "$(gh release list --limit 5 2>&1)" || true
            exit 1
          fi

      - name: Check whether this version is already on npm
        id: npmcheck
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "fin-doc-pipeline@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: env.NPM_TOKEN != '' && steps.npmcheck.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      - name: Explain a skipped publish
        if: env.NPM_TOKEN == '' || steps.npmcheck.outputs.exists == 'true'
        run: |
          echo '::notice::npm publish was skipped (no token, or this version already exists).'
